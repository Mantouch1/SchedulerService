services:
  scheduler-service-db:
    image: postgres:17
    container_name: scheduler-service-db
    environment:
      POSTGRES_DB: scheduler_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - scheduler_service_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d scheduler_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler-service:
    build: .
    container_name: scheduler-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://scheduler-service-db:5432/scheduler_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_SERVICE_URL: http://identity-service:8082
      TENDERFLOW_SERVICE_URL: http://tenderflow:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      REPORT_SERVICE_URL: http://reporting-service:8086
      SERVICE_ACCOUNT_EMAIL: ${SERVICE_ACCOUNT_EMAIL}
      SERVICE_ACCOUNT_PASSWORD: ${SERVICE_ACCOUNT_PASSWORD}
      OPEN_STATUS_NAME: ${OPEN_STATUS_NAME:-OPEN}
    depends_on:
      scheduler-service-db:
        condition: service_healthy
    networks:
      - default
      - platform-net

volumes:
  scheduler_service_pgdata:

networks:
  platform-net:
    external: true   # create once: docker network create platform-net
