
# === Application ===
spring.application.name=scheduler-service

# === Server Port ===
server.port=8087

# === PostgreSQL Database Configuration ===
# Local: localhost:5432
# Docker: scheduler-postgres:5432

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scheduler_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1111}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate Configuration ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# === JWT Configuration ===
# Must be identical to IdentityService
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_THE_SAME_SECRET_AS_IDENTITY_SERVICE}

# === Other Services (Feign) ===
# Local URLs are used by default.
# Docker URLs must match the actual container names.

identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8082}
tenderflow.service.url=${TENDERFLOW_SERVICE_URL:http://localhost:8090}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8084}
report.service.url=${REPORT_SERVICE_URL:http://localhost:8086}

# === Service Account ===
app.service-account.email=${SERVICE_ACCOUNT_EMAIL:}
app.service-account.password=${SERVICE_ACCOUNT_PASSWORD:}

# === Audit Configuration ===
app.audit.enabled=${AUDIT_ENABLED:true}

# === OpenFeign Configuration ===
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# === Jobs Configuration ===
app.jobs.timezone=${JOBS_TIMEZONE:Europe/Berlin}
app.jobs.open-status-name=${OPEN_STATUS_NAME:OPEN}
app.jobs.deadline-reminder.days-before=${REMINDER_DAYS_BEFORE:3}

# === Scheduler Cron ===
# Every day at 08:00
app.jobs.deadline-reminder.cron=${REMINDER_CRON:0 0 8 * * *}

# === Actuator ===
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
